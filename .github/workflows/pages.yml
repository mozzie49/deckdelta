name: Deploy Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run demo:record
      - run: python3 scripts/package-static.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-browser-demo
          path: |
            dist/deckdelta-preview.png
            dist/deckdelta-demo.webm
            dist/deckdelta-demo.vtt
            dist/deckdelta-demo.json
            dist/deckdelta-static.zip
            dist/deckdelta-static.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
